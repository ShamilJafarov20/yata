# Screenshots of the notch (tools/make-shots.ps1) on a Windows runner, for a push to the "shots" branch
# or a manual run. The images come out as the "screenshots" artifact.
name: Screenshots

on:
  push:
    branches: [shots]
    paths: ["src/**", "tools/make-shots.ps1", ".github/workflows/shots.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Screenshots
        shell: pwsh
        run: ./tools/make-shots.ps1 -Languages en -OutDir "$env:RUNNER_TEMP\shots" -SiteDir "$env:RUNNER_TEMP\site-shots"

      - name: Log
        if: always()
        shell: pwsh
        run: Get-ChildItem "$env:TEMP\yata-shots\profile" -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 80 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots

      # Also committed to this branch, so the images can be fetched with git alone.
      - name: Commit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force docs/screenshots-fork | Out-Null
          Copy-Item "$env:RUNNER_TEMP\shots\en\*.png" docs/screenshots-fork/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots-fork
          git commit -m "Screenshots from the Windows runner"
          git push
