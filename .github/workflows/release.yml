# Builds the installer on GitHub and publishes a release whenever a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0
# Code signing (SignPath Foundation) turns on once the SIGNPATH_ORGANIZATION_ID variable and the
# SIGNPATH_API_TOKEN secret exist; until then releases stay unsigned. See docs/code-signing.md.
# Every release gets a build provenance attestation (gh attestation verify <file> --repo ShamilJafarov20/yata).
# The Google OAuth client (for Calendar and Tasks) is embedded when its secrets exist; without them the
# release still goes out, with Google sign-in unavailable. Notes come from .github/release-notes/<version>.md..
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # SignPath downloads the unsigned artifacts with this workflow's token.
  actions: read
  # Build provenance attestation (actions/attest).
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  release:
    runs-on: windows-latest
    env:
      HAS_GOOGLE: ${{ secrets.YATA_GOOGLE_CLIENT_ID != '' && secrets.YATA_GOOGLE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        run: dotnet test --nologo

      - name: Version from tag
        shell: pwsh
        run: echo "VERSION=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_ENV

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Publish Yata.exe
        shell: pwsh
        env:
          # Google OAuth client for the calendar (see docs/google-calendar.md).
          YATA_GOOGLE_CLIENT_ID: ${{ secrets.YATA_GOOGLE_CLIENT_ID }}
          YATA_GOOGLE_CLIENT_SECRET: ${{ secrets.YATA_GOOGLE_CLIENT_SECRET }}
        run: |
          if (-not $env:YATA_GOOGLE_CLIENT_ID -or -not $env:YATA_GOOGLE_CLIENT_SECRET) {
            Write-Warning "No Google OAuth secrets: this build can't sign in to Google Calendar and Tasks"
          }
          ./tools/build-installer.ps1 -Version $env:VERSION -PublishOnly

      - name: Check the Google client is in the build
        if: env.HAS_GOOGLE == 'true'
        shell: pwsh
        # The single-file exe keeps Yata.dll uncompressed, so the metadata key is plain text in it.
        # Only presence is reported; the values never reach the log.
        run: |
          $bytes = [IO.File]::ReadAllBytes("publish\Yata.exe")
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          foreach ($key in "GoogleClientId", "GoogleClientSecret") {
            if (-not $text.Contains($key)) { throw "$key is not embedded in publish\Yata.exe" }
          }
          if (-not $text.Contains(".apps.googleusercontent.com")) { throw "Google client id not found in publish\Yata.exe" }
          "Google client embedded"

      # Signed before it goes into the installer, so the installed app carries the signature too.
      - name: Upload unsigned Yata.exe
        id: upload-app
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: publish/Yata.exe
          archive: false

      - name: Sign Yata.exe
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: yata
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.VERSION) }}
          # Every release waits for a manual approval in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-app
          skip-decompress: true

      - name: Use the signed Yata.exe
        if: env.SIGNING == 'true'
        shell: pwsh
        run: Copy-Item signed-app\Yata.exe publish\Yata.exe -Force

      - name: Build installer
        shell: pwsh
        run: ./tools/build-installer.ps1 -Version $env:VERSION -SkipPublish

      - name: Upload unsigned installer
        id: upload-installer
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: dist/Yata-Setup-${{ env.VERSION }}.exe
          archive: false

      - name: Sign installer
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: yata
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.VERSION) }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-installer
          skip-decompress: true

      - name: Use the signed installer
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          Copy-Item "signed-installer\Yata-Setup-$env:VERSION.exe" dist\ -Force
          foreach ($file in "publish\Yata.exe", "dist\Yata-Setup-$env:VERSION.exe") {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") { throw "$file is not validly signed: $($sig.Status)" }
            "$file signed by $($sig.SignerCertificate.Subject)"
          }

      # A fixed-name copy that only the site's Download button links to, so its download count
      # tells site downloads apart from in-app updates (which take Yata-Setup-x.y.z.exe).
      - name: Site download copy
        shell: pwsh
        run: Copy-Item "dist\Yata-Setup-$env:VERSION.exe" dist\Yata-Setup.exe

      # Yata.exe and yata-cli.exe without the installer (needs the .NET 10 Desktop Runtime).
      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "dist\Yata-$env:VERSION-portable"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item publish\Yata.exe, publish\yata-cli.exe $dir
          Compress-Archive -Path $dir -DestinationPath "dist\Yata-$env:VERSION-portable.zip" -Force

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist\*.exe, dist\*.zip | ForEach-Object {
            "$((Get-FileHash $_ -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content dist\SHA256SUMS.txt

      # A record signed by GitHub that ties the installer to this run and commit.
      - uses: actions/attest@v4
        with:
          subject-path: dist/*.exe

      - uses: softprops/action-gh-release@v3
        with:
          name: Yata ${{ env.VERSION }}
          body_path: .github/release-notes/${{ env.VERSION }}.md
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
